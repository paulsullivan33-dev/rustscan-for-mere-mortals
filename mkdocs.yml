site_name: RustScan for Mere Mortals
site_description: A very fast port scanner that knocks on every door of your own machines and hands the open ones to nmap. Batches, timeouts and the file limit explained, ghost ports exposed, the permission rule stated before the first scan, and the limits named plainly.
site_url: https://paulsullivan33-dev.github.io/rustscan-for-mere-mortals/
